# Local development database for Holoraa v2. PostgreSQL only.
#
# Isolation (see docs/engineering/LOCAL_SETUP.md):
#   - container: holoraa-v2-postgres (not the legacy holoraa-postgres)
#   - volume:    holoraa_v2_postgres_data (not the legacy holoraa_postgres_data)
#   - port:      127.0.0.1 only, host port 5433 by default
#
# Credentials come from the local .env file created by scripts/dev-env.sh.
# Nothing secret is written in this file.

name: holoraa-v2

services:
  postgres:
    image: postgres:17-alpine
    container_name: holoraa-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: holoraa
      POSTGRES_PASSWORD: ${HOLORAA_DEV_DB_PASSWORD:?Run scripts/dev-env.sh first}
      POSTGRES_DB: holoraa_dev
    ports:
      - "127.0.0.1:${HOLORAA_DEV_DB_PORT:-5433}:5432"
    volumes:
      - holoraa_v2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holoraa -d holoraa_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  holoraa_v2_postgres_data:
    name: holoraa_v2_postgres_data
