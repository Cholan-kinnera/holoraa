version: "2"
sql:
  - engine: "postgresql"
    schema: "backend/db/migrations"
    queries: "backend/db/queries"
    gen:
      go:
        package: "dbstore"
        out: "backend/internal/store/dbstore"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
