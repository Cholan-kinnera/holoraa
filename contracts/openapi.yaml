openapi: 3.1.1
info:
  title: Holoraa API
  version: 0.2.0
  summary: HTTP API for Holoraa. Foundation endpoints and sign-in with email codes.
  description: |
    Source of truth for the HTTP API (AGENTS.md, "Contracts and generated code").
    Defined here: liveness and readiness, email one-time code sign-in, server
    sessions, and profiles. Other feature endpoints are added at their milestones.

    Every error response uses RFC 9457 Problem Details. Internal error detail is
    never returned to clients. Sign-in responses do not reveal whether an account
    exists (ADR 0009).
servers:
  - url: http://127.0.0.1:8080
    description: Local development. The address comes from HOLORAA_HTTP_ADDR.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness
      description: Reports that the process is running. Does not check dependencies.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ready:
    get:
      operationId: getReady
      summary: Readiness
      description: Reports whether the database answers within the server's timeout.
      security: []
      responses:
        "200":
          description: The service is ready and the database answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: The database is not reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp:
    post:
      operationId: sendSignInCode
      summary: Send a sign-in code
      description: |
        Emails a six-digit code to the address. The response is the same for
        known and unknown addresses. Requires an allowed Origin header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
      responses:
        "202":
          description: The code was sent, or the request was accepted without revealing the account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          description: A send limit was reached. Retry-After gives the wait in seconds.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The code could not be delivered. Nothing was recorded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/verify:
    post:
      operationId: verifySignInCode
      summary: Verify a sign-in code
      description: |
        Checks the code once. On success, creates or finds the account, starts a
        new session, and sets the session cookie. Any session the request carries
        is revoked. Every failure is the same generic 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: The code is invalid, expired, already used, or locked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          description: Too many failed attempts from this client. Retry-After gives the wait in seconds.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Current session
      description: Returns the signed-in user and the CSRF token for this session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: Revokes the current session and clears the cookie.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: The session is revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMyProfile
      summary: Own profile
      description: Returns the signed-in user's profile, including the email address.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMyProfile
      summary: Update own profile
      description: |
        Partial update. Absent fields are unchanged. A null bio or avatar clears
        it. Username and display name cannot be cleared. The user is always the
        signed-in user; no user ID is accepted.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: The username is already taken.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{username}:
    get:
      operationId: getPublicProfile
      summary: Public profile
      description: Returns a user's public profile. The email address is never included.
      security:
        - sessionCookie: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username, case-insensitive.
          schema:
            type: string
            minLength: 3
            maxLength: 32
      responses:
        "200":
          description: The public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/thoughts:
    get:
      operationId: getThoughts
      summary: List thoughts
      description: Returns a chronologically cursor-paginated list of thoughts from followed users and the calm graph.
      security:
        - sessionCookie: []
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [foryou, following, media]
            default: foryou
        - name: q
          in: query
          required: false
          description: Search term matched against thoughts text via PostgreSQL tsvector full-text search.
          schema:
            type: string
            maxLength: 100
        - name: before
          in: query
          required: false
          description: UUIDv7 cursor for backward chronological pagination.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of thoughts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtsListResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createThought
      summary: Post a new thought
      description: Publishes a spontaneous thought or status update to The Spot.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThoughtRequest"
      responses:
        "201":
          description: Thought successfully published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/thoughts/{id}/likes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: likeThought
      summary: Like a thought
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Like recorded.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unlikeThought
      summary: Unlike a thought
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Like removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/notes:
    get:
      operationId: getActiveNotes
      summary: Get active notes
      description: Returns ephemeral 24-hour status notes of followed accounts and active orbit connections.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active status notes list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserNote"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/note:
    put:
      operationId: setMyNote
      summary: Set 24-hour status note
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNoteRequest"
      responses:
        "200":
          description: Note updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNote"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearMyNote
      summary: Clear own status note
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Note cleared.
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/settings:
    get:
      operationId: getMySettings
      summary: Get user settings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User privacy and notification settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMySettings
      summary: Update user settings
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettingsRequest"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rooms/{slug}:
    get:
      operationId: getPersonalRoom
      summary: Get personal room state
      description: Returns room configuration, lock state, and waiting room requirement for the slug.
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{2,31}$"
      responses:
        "200":
          description: Personal room details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalRoom"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/follows/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: followUser
      summary: Follow user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Successfully followed.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unfollowUser
      summary: Unfollow user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Successfully unfollowed.
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/social/orbit:
    get:
      operationId: getOrbitRecommendations
      summary: Get orbit recommendations
      description: Computes 2-hop mutual recommendations ordered by mutual connection density.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Orbit suggestions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrbitRecommendation"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-holoraa_session
      description: |
        The server-side session cookie (HttpOnly, Secure, SameSite=Lax). Local
        development over plain HTTP uses the name holoraa_session without the
        __Host- prefix (HOLORAA_COOKIE_SECURE=false).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The token returned by GET /v1/auth/session. Required on state-changing requests.
  responses:
    Problem:
      description: An error, described with RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LiveStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          const: ready
        database:
          type: string
          const: ok
    Email:
      type: string
      minLength: 3
      maxLength: 254
      description: An email address. The server trims it and lowercases it.
    SendCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    SendCodeAccepted:
      type: object
      additionalProperties: false
      required: [challengeId]
      properties:
        challengeId:
          type: string
          format: uuid
          description: Identifies the challenge. Send it with the code to verify.
    VerifyCodeRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Six digits.
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, displayName, bio, avatarUrl, profileComplete]
      description: The signed-in user's own profile.
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        username:
          type: [string, "null"]
          pattern: "^[a-z][a-z0-9_]{2,31}$"
          description: Null until profile setup.
        displayName:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
        bio:
          type: [string, "null"]
          maxLength: 300
        avatarUrl:
          type: [string, "null"]
          maxLength: 2048
        profileComplete:
          type: boolean
          description: True once a username is set.
    UserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          minLength: 1
    ProfileUpdate:
      type: object
      additionalProperties: false
      description: Every field is optional. Send only the fields to change.
      properties:
        username:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]{2,31}$"
          description: Case is folded to lowercase. Must be unique.
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        bio:
          type: [string, "null"]
          maxLength: 300
        avatarUrl:
          type: [string, "null"]
          maxLength: 2048
          description: An https URL. Null clears it.
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName, bio, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,31}$"
        displayName:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
    Problem:
      type: object
      description: RFC 9457 Problem Details. Internal detail is never included.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI that identifies the problem type. about:blank when no specific type exists.
        title:
          type: string
          description: A short, fixed summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: A safe, human-readable explanation for this occurrence.
        instance:
          type: string
          description: The request path that produced the problem. Never includes the query string.
    Thought:
      type: object
      additionalProperties: false
      required: [id, author, text, mood, photoUrl, likesCount, likedByMe, repliesCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/PublicProfile"
        text:
          type: string
          minLength: 1
          maxLength: 280
        mood:
          type: [string, "null"]
          maxLength: 32
        photoUrl:
          type: [string, "null"]
          maxLength: 2048
        likesCount:
          type: integer
          minimum: 0
        likedByMe:
          type: boolean
        repliesCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    CreateThoughtRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
        mood:
          type: [string, "null"]
          maxLength: 32
        photoUrl:
          type: [string, "null"]
          maxLength: 2048
        syncToNote:
          type: boolean
          default: false
    ThoughtResponse:
      type: object
      additionalProperties: false
      required: [thought]
      properties:
        thought:
          $ref: "#/components/schemas/Thought"
    ThoughtsListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Thought"
        nextCursor:
          type: [string, "null"]
          format: uuid
    UserNote:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, avatarUrl, text, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,31}$"
        displayName:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        text:
          type: string
          minLength: 1
          maxLength: 60
        expiresAt:
          type: string
          format: date-time
    SetNoteRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 60
    UserSettings:
      type: object
      additionalProperties: false
      required: [readReceiptsEnabled, activeStatusEnabled, quietHoursEnabled, quietHoursStart, quietHoursEnd]
      properties:
        readReceiptsEnabled:
          type: boolean
        activeStatusEnabled:
          type: boolean
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: [string, "null"]
        quietHoursEnd:
          type: [string, "null"]
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        readReceiptsEnabled:
          type: boolean
        activeStatusEnabled:
          type: boolean
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: [string, "null"]
        quietHoursEnd:
          type: [string, "null"]
    PersonalRoom:
      type: object
      additionalProperties: false
      required: [slug, host, isLocked, waitingRoomEnabled]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,31}$"
        host:
          $ref: "#/components/schemas/PublicProfile"
        isLocked:
          type: boolean
        waitingRoomEnabled:
          type: boolean
    OrbitRecommendation:
      type: object
      additionalProperties: false
      required: [user, mutualsCount, mutualSample, isFollowing]
      properties:
        user:
          $ref: "#/components/schemas/PublicProfile"
        mutualsCount:
          type: integer
          minimum: 0
        mutualSample:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfile"
        isFollowing:
          type: boolean
